; Standalone audio + microphone test project for the ESP32-S3
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; This project is serial-only (no TFT). All results are printed to the
; serial console at 115200 baud.
;
; espressif32@6.9.0 (Arduino-ESP32 2.0.17) is pinned because the test uses the
; legacy driver/i2s.h API.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-include include/config.h
